name: Build Windows app

on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", ".github/workflows/build-windows.yml"]
  # Pull requests are built and tested the same way; only main publishes a release.
  pull_request:
    paths: ["backend/**", "frontend/**", ".github/workflows/build-windows.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build studio UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test backend (with a real Piper voice)
        working-directory: backend
        shell: pwsh
        run: |
          pip install -r requirements-dev.txt
          $voice = "https://huggingface.co/rhasspy/piper-voices/resolve/main/ml/ml_IN/meera/medium/ml_IN-meera-medium"
          New-Item -ItemType Directory -Force voice | Out-Null
          Invoke-WebRequest "$voice.onnx" -OutFile voice/ml_IN-meera-medium.onnx
          Invoke-WebRequest "$voice.onnx.json" -OutFile voice/ml_IN-meera-medium.onnx.json
          $env:VOIX_TEST_PIPER_DIR = (Resolve-Path voice).Path
          $env:PYTHONUTF8 = "1"
          python -m pytest -q -rs
          Remove-Item -Recurse -Force voice

      - name: Package VOIX.exe
        working-directory: backend
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onefile --name VOIX --console --add-data "../frontend/dist:frontend" --collect-submodules uvicorn --collect-all piper --collect-all onnxruntime voix_launcher.py

      - name: Smoke test the exe (real Malayalam speech)
        shell: pwsh
        run: |
          $api = "http://127.0.0.1:8765/api/v1"
          $proc = Start-Process -FilePath backend/dist/VOIX.exe -ArgumentList "--no-browser","--port","8765" -PassThru
          try {
            $up = $false
            foreach ($i in 1..40) {
              Start-Sleep -Seconds 2
              try { if ((Invoke-RestMethod "$api/health").tts_ready) { $up = $true; break } } catch {}
            }
            if (-not $up) { throw "VOIX.exe did not start with a ready TTS engine" }
            if ((Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing).Content -notmatch "VOIX") { throw "studio not served" }

            Invoke-RestMethod -Method Post "$api/catalog/ml_IN-meera-medium/install" | Out-Null
            $body = '{"text":"\u0d28\u0d2e\u0d38\u0d4d\u0d15\u0d3e\u0d30\u0d02 \u0d15\u0d41\u0d1f\u0d4d\u0d1f\u0d3f\u0d15\u0d33\u0d47! 25 + 5 = 30.","voice_id":"ml_in_meera_medium"}'
            $job = Invoke-RestMethod -Method Post "$api/tts/generate" -ContentType "application/json" -Body $body
            foreach ($i in 1..60) {
              $job = Invoke-RestMethod "$api/tts/jobs/$($job.job_id)"
              if ($job.status -in "completed","failed") { break }
              Start-Sleep -Seconds 1
            }
            if ($job.status -ne "completed") { throw "generation did not complete: $($job | ConvertTo-Json)" }
            Invoke-WebRequest "$api/audio/$($job.job_id)?format=mp3" -OutFile sample.mp3
            $size = (Get-Item sample.mp3).Length
            Write-Host "Generated $($job.audio_seconds) s of Malayalam audio in $($job.generation_seconds) s; MP3 is $size bytes."
            if ($job.audio_seconds -lt 1.5 -or $size -lt 8000) { throw "audio is too short to be real speech" }
          } finally {
            Stop-Process -Id $proc.Id -Force
          }

      - uses: actions/upload-artifact@v4
        with:
          name: VOIX-windows
          path: backend/dist/VOIX.exe

  build-ai:
    # VOIX-AI: the same app plus PyTorch, for RVC character voices, Qwen3-TTS and emotion detection.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build studio UI
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the AI runtime (CPU PyTorch)
        working-directory: backend
        run: |
          pip install -r requirements-dev.txt
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-ai.txt
          pip install --no-deps qwen-tts==0.1.1

      - name: Test backend with the AI runtime (real RVC network, tiny weights)
        working-directory: backend
        env:
          PYTHONUTF8: "1"
        run: python -m pytest -q -rs

      - name: Package VOIX-AI (one folder)
        working-directory: backend
        run: |
          pip install pyinstaller
          pyinstaller --noconfirm --onedir --name VOIX --console --distpath dist-ai --add-data "../frontend/dist:frontend" --collect-submodules uvicorn --collect-all piper --collect-all onnxruntime --collect-all qwen_tts --collect-all torchfcpe --collect-submodules transformers.models.hubert --collect-data librosa --copy-metadata qwen-tts voix_launcher.py

      - name: Smoke test VOIX-AI (RVC conversion inside the packaged app)
        shell: pwsh
        working-directory: backend
        run: |
          $api = "http://127.0.0.1:8766/api/v1"
          $proc = Start-Process -FilePath dist-ai/VOIX/VOIX.exe -ArgumentList "--no-browser","--port","8766" -PassThru
          try {
            $up = $false
            foreach ($i in 1..90) {
              Start-Sleep -Seconds 2
              try { if ((Invoke-RestMethod "$api/health").conversion_ready) { $up = $true; break } } catch {}
            }
            if (-not $up) { throw "VOIX-AI did not start with RVC ready" }
            $env:PYTHONUTF8 = "1"
            python ci_smoke_ai.py dist-ai/VOIX/voix-data $api
            if ($LASTEXITCODE -ne 0) { throw "AI smoke test failed" }
          } finally {
            Stop-Process -Id $proc.Id -Force
          }
          Remove-Item -Recurse -Force dist-ai/VOIX/voix-data
          Compress-Archive -Path dist-ai/VOIX -DestinationPath VOIX-AI-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: VOIX-AI-windows
          path: backend/VOIX-AI-windows.zip

  release:
    if: github.event_name != 'pull_request'
    needs: [build, build-ai]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.${{ github.run_number }}
          name: VOIX v0.3.${{ github.run_number }}
          make_latest: true
          files: |
            out/VOIX-windows/VOIX.exe
            out/VOIX-AI-windows/VOIX-AI-windows.zip
          body: |
            **VOIX.exe**: double-click it. Piper voices only, small and fast.

            **VOIX-AI-windows.zip**: unzip, then run `VOIX\VOIX.exe`. Adds RVC character voices,
            the Voice Changer (re-voice an MP3), Qwen3-TTS and automatic emotion. Larger and slower to start.

            Add voices in Voice Library or from the Hugging Face page, then generate in Voice Studio.
